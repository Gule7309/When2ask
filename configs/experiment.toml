[upstream]
repository = "https://github.com/MananSuri27/ClarifyBench.git"
commit = "a85d4f9df1fc87d05c713fd408f8a57d72bcc348"
dataset = "ClarifyBench/ClarifyBench_A"

[paper]
lambda = 0.5
alpha = 0.1
epsilon = 1e-4
temperature = 0.5

[reconstruction]
candidate_prompt = "reconstructed_v1"
threshold_quantity = "raw_viability"
include_optional_parameters = true

[development_model]
backend = "ollama"
model = "qwen2.5:7b"
base_url = "http://localhost:11434/v1"
role = "pipeline_validation_only"

[study]
conditions = ["natural", "oracle_complete", "forced_miss"]
candidate_sizes = [1, 3, 5, 10]
tau_exec_sweep = [0.5, 0.6, 0.7, 0.8, 0.9]
primary_simulator = "deterministic_oracle"
robustness_simulator = "paper_style_llm"

[metrics]
hcwe_thresholds = [0.5, 0.6, 0.7, 0.8, 0.9]
